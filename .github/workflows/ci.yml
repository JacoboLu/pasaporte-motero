name: PASAPORTE MOTERO CI
on:
  pull_request:
    branches: [main]
    paths:
      - "pasaporte-motero/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "pasaporte-motero/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pasaporte-motero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Falta package-lock.json; se usa npm install (compilación no reproducible)."
            npm install
          fi
      - run: npm run build
      - run: npm run test:phase1
